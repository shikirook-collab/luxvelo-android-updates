name: Verify and publish the signed Alpha 83 update
on:
  push:
    branches: [codex/alpha83-release]
    paths: ['.github/workflows/publish-alpha83.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify the release payload and both APK signatures
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/alpha82.apk"
          apk="$RUNNER_TEMP/alpha83.apk"
          curl -fsSL --retry 2 'https://github.com/shikirook-collab/luxvelo-android-updates/releases/download/android-test-82-v0.1.0-alpha.82/LuxVelo-android-test-82-v0.1.0-alpha.82.apk' -o "$reference"
          printf '%s  %s\n' 'df5236acc2bb3527bf10a57d7653b9f023324b9889ea7720df92707bbb563500' "$reference" | sha256sum --check
          printf '%s  %s\n' 'db237700a3016a5701f68f8aa44cb6801bb63ac13f9e3deb472d11d07741762d' 'alpha83-public-base/from-public82.zst' | sha256sum --check
          zstd -q -d --long=28 --patch-from="$reference" alpha83-public-base/from-public82.zst -o "$apk"
          printf '%s  %s\n' '8a381130b0fe081cbe30698d21a66b460529673753af4d11b1e240b0812d90bc' "$apk" | sha256sum --check
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          mkdir -p "$RUNNER_TEMP/verification"
          for code in 82 83; do
            candidate="$RUNNER_TEMP/alpha$code.apk"
            "$tools/apksigner" verify --verbose --print-certs "$candidate" | tee "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            grep -E 'certificate SHA-256 digest: 91f2d8e2b1e834474d424042f13d12704dc86c9715ae5b51c82f2a41d54a5b73$' "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            test "$(grep -c 'certificate SHA-256 digest:' "$RUNNER_TEMP/verification/alpha$code-signature.txt")" = 1
            "$tools/aapt" dump badging "$candidate" > "$RUNNER_TEMP/verification/alpha$code-badging.txt"
            grep -F "package: name='ru.luxvelo.preview.test' versionCode='$code' versionName='0.1.0-alpha.$code'" "$RUNNER_TEMP/verification/alpha$code-badging.txt"
          done
          "$tools/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk" > "$RUNNER_TEMP/verification/signed-apk-sha256.txt"
      - name: Compare every unsigned APK entry with the signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/alpha83.apk" "$RUNNER_TEMP/verification/content-comparison.json" <<'PYCODE'
          import hashlib, json, pathlib, re, sys, zipfile
          raw = pathlib.Path('alpha83-public-base/unsigned-zip-entries.json').read_bytes()
          assert len(raw) == 87969
          assert hashlib.sha256(raw).hexdigest() == '1c6de6f938696f9e001cb26cc24310cbf10f904d740fc65a9bf857fd1048644b'
          expected = json.loads(raw)
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert len(apk.namelist()) == len(set(apk.namelist()))
              actual = {n: hashlib.sha256(apk.read(n)).hexdigest() for n in apk.namelist()}
          assert all(actual.get(name) == digest for name, digest in expected.items())
          extra = sorted(actual.keys() - expected.keys())
          assert all(re.fullmatch(r'META-INF/(MANIFEST\.MF|[^/]+\.(SF|RSA|DSA|EC))', n) for n in extra)
          report = {'status': 'PASS', 'matched_unsigned_entries': len(expected), 'additional_signature_entries': extra}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PYCODE
      - name: Verify the before-publication Android upgrade result
        run: |
          set -euo pipefail
          printf '%s  %s\n' '99e491650ed67e4ea16ce43b7fd64268ee155edf65a11bf3c52e648cec687dd4' alpha83-public-base/upgrade-result.json | sha256sum --check
          jq -e '.upgrade == "82 -> 83" and .uid_preserved and .setting_preserved and .home_and_chooser_navigation == "PASS" and .launch == "ok"' alpha83-public-base/upgrade-result.json
          cp alpha83-public-base/upgrade-result.json "$RUNNER_TEMP/verification/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: luxvelo-alpha83-publication-evidence
          path: ${{ runner.temp }}/verification/
          retention-days: 7
      - name: Publish verified Alpha 83 in the ordinary update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-test-83-v0.1.0-alpha.83
          name="LuxVelo-$tag.apk"
          cp "$RUNNER_TEMP/alpha83.apk" "$RUNNER_TEMP/$name"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags"
          python3 - "$RUNNER_TEMP/tags" <<'PYRELEASE'
          import pathlib, re, sys
          tags = pathlib.Path(sys.argv[1]).read_text().splitlines()
          for tag in tags:
              match = re.fullmatch(r'android-test-(\d+)-v.*', tag)
              assert not match or int(match[1]) < 83, 'Alpha 83 or a newer version exists'
          PYRELEASE
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo 'Release tag already exists' >&2
            exit 1
          else
            test "$?" = 2
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh release create "$tag" "$RUNNER_TEMP/$name" --repo "$GITHUB_REPOSITORY" --target "$main" --draft --prerelease=false --latest=false --title 'LuxVelo · Alpha 83' --notes-file alpha83-public-base/release-notes.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name=="android-test-83-v0.1.0-alpha.83")' > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/$name" <<'PYDRAFT'
          import json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          apk = pathlib.Path(sys.argv[2])
          assert release['draft'] and not release['prerelease']
          assert len(release['assets']) == 1
          asset = release['assets'][0]
          assert asset['name'] == apk.name and asset['state'] == 'uploaded'
          assert asset['size'] == apk.stat().st_size
          assert asset['digest'] == 'sha256:8a381130b0fe081cbe30698d21a66b460529673753af4d11b1e240b0812d90bc'
          PYDRAFT
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
