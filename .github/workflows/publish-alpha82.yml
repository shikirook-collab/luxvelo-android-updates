name: Verify and publish the signed Alpha 82 update
on:
  push:
    branches: [codex/alpha82-release]
    paths: ['.github/workflows/publish-alpha82.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify the release payload and both APK signatures
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/alpha81.apk"
          apk="$RUNNER_TEMP/alpha82.apk"
          curl -fsSL --retry 2 'https://github.com/shikirook-collab/luxvelo-android-updates/releases/download/android-test-81-v0.1.0-alpha.81/LuxVelo-android-test-81-v0.1.0-alpha.81.apk' -o "$reference"
          printf '%s  %s\n' '5dec2cb3821330bd4ee3dac2133d832313558206cc9b6cb1adcfd8a4890f9ea6' "$reference" | sha256sum --check
          printf '%s  %s\n' '0d09ab04d16becb08f43ec9ec7b0ee87105de52f2de1cd448f7a860134199d6b' 'alpha82-public-base/from-public81.zst' | sha256sum --check
          zstd -q -d --long=28 --patch-from="$reference" alpha82-public-base/from-public81.zst -o "$apk"
          printf '%s  %s\n' 'df5236acc2bb3527bf10a57d7653b9f023324b9889ea7720df92707bbb563500' "$apk" | sha256sum --check
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          mkdir -p "$RUNNER_TEMP/verification"
          for code in 81 82; do
            candidate="$RUNNER_TEMP/alpha$code.apk"
            "$tools/apksigner" verify --verbose --print-certs "$candidate" | tee "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            grep -E 'certificate SHA-256 digest: 91f2d8e2b1e834474d424042f13d12704dc86c9715ae5b51c82f2a41d54a5b73$' "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/verification/alpha$code-signature.txt"
            test "$(grep -c 'certificate SHA-256 digest:' "$RUNNER_TEMP/verification/alpha$code-signature.txt")" = 1
            "$tools/aapt" dump badging "$candidate" > "$RUNNER_TEMP/verification/alpha$code-badging.txt"
            grep -F "package: name='ru.luxvelo.preview.test' versionCode='$code' versionName='0.1.0-alpha.$code'" "$RUNNER_TEMP/verification/alpha$code-badging.txt"
          done
          "$tools/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk" > "$RUNNER_TEMP/verification/signed-apk-sha256.txt"
      - name: Compare every unsigned APK entry with the signed APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/alpha82.apk" "$RUNNER_TEMP/verification/content-comparison.json" <<'PYCODE'
          import hashlib, json, pathlib, re, sys, zipfile
          raw = pathlib.Path('alpha82-public-base/unsigned-zip-entries.json').read_bytes()
          assert len(raw) == 87969
          assert hashlib.sha256(raw).hexdigest() == 'dc399cb3f7a08d5aa3d1731609bc2f413570cfed77fb92f9ee98ab7d60fb768d'
          expected = json.loads(raw)
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert len(apk.namelist()) == len(set(apk.namelist()))
              actual = {n: hashlib.sha256(apk.read(n)).hexdigest() for n in apk.namelist()}
          assert all(actual.get(name) == digest for name, digest in expected.items())
          extra = sorted(actual.keys() - expected.keys())
          assert all(re.fullmatch(r'META-INF/(MANIFEST\.MF|[^/]+\.(SF|RSA|DSA|EC))', n) for n in extra)
          report = {'status': 'PASS', 'matched_unsigned_entries': len(expected), 'additional_signature_entries': extra}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PYCODE
      - name: Boot known Android image using existing runner sudo access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          avd=luxvelo-alpha82-upgrade
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avds"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          adb="$ANDROID_HOME/platform-tools/adb"
          image='system-images;android-36;google_apis;x86_64'
          "$sdk/sdkmanager" --install "$image" </dev/null
          printf 'no\n' | "$sdk/avdmanager" create avd -n "$avd" -k "$image" -p "$ANDROID_AVD_HOME/$avd.avd" --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$ANDROID_AVD_HOME/$avd.avd" > "$ANDROID_AVD_HOME/$avd.ini"
          before=$(stat -c '%u:%g:%a' /dev/kvm)
          printf '%s\n' "$before" > "$RUNNER_TEMP/verification/kvm-permissions-before.txt"
          sudo -n "$ANDROID_HOME/emulator/emulator" -accel-check
          "$adb" start-server
          sudo -n env ANDROID_AVD_HOME="$ANDROID_AVD_HOME" ANDROID_USER_HOME="$ANDROID_USER_HOME" \
            ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            "$ANDROID_HOME/emulator/emulator" -avd "$avd" -accel on \
            -port 5554 -memory 2048 -cores 2 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader >"$RUNNER_TEMP/verification/emulator.log" 2>&1 &
          emulator_pid=$!
          finish() {
            status=$?
            if [ "$status" -ne 0 ]; then tail -100 "$RUNNER_TEMP/verification/emulator.log"; "$adb" -s emulator-5554 shell getprop sys.boot_completed || true; fi
            "$adb" -s emulator-5554 emu kill || sudo -n kill "$emulator_pid" || true
            after=$(stat -c '%u:%g:%a' /dev/kvm)
            printf '%s\n' "$after" > "$RUNNER_TEMP/verification/kvm-permissions-after.txt"
            if [ "$before" != "$after" ]; then echo 'KVM permissions unexpectedly changed' >&2; exit 1; fi
            exit "$status"
          }
          trap finish EXIT
          timeout 360 "$adb" -s emulator-5554 wait-for-device
          timeout 480 bash -c 'until [[ "$("$1" -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done' _ "$adb"
          python3 scripts/verify_alpha82_upgrade.py \
            --adb "$adb" --alpha81 "$RUNNER_TEMP/alpha81.apk" --alpha82 "$RUNNER_TEMP/alpha82.apk" \
            --output "$RUNNER_TEMP/verification"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: luxvelo-alpha82-complete-verification
          path: ${{ runner.temp }}/verification/
          retention-days: 7
      - name: Publish verified Alpha 82 in the ordinary update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-test-82-v0.1.0-alpha.82
          name="LuxVelo-$tag.apk"
          cp "$RUNNER_TEMP/alpha82.apk" "$RUNNER_TEMP/$name"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags"
          python3 - "$RUNNER_TEMP/tags" <<'PYRELEASE'
          import pathlib, re, sys
          tags = pathlib.Path(sys.argv[1]).read_text().splitlines()
          for tag in tags:
              match = re.fullmatch(r'android-test-(\d+)-v.*', tag)
              assert not match or int(match[1]) < 82, 'Alpha 82 or a newer version exists'
          PYRELEASE
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo 'Release tag already exists' >&2
            exit 1
          else
            test "$?" = 2
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh release create "$tag" "$RUNNER_TEMP/$name" --repo "$GITHUB_REPOSITORY" --target "$main" --draft --prerelease=false --latest=false --title 'LuxVelo · Alpha 82' --notes-file alpha82-public-base/release-notes.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]|select(.tag_name=="android-test-82-v0.1.0-alpha.82")' > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" "$RUNNER_TEMP/$name" <<'PYDRAFT'
          import json, pathlib, sys
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          apk = pathlib.Path(sys.argv[2])
          assert release['draft'] and not release['prerelease']
          assert len(release['assets']) == 1
          asset = release['assets'][0]
          assert asset['name'] == apk.name and asset['state'] == 'uploaded'
          assert asset['size'] == apk.stat().st_size
          assert asset['digest'] == 'sha256:df5236acc2bb3527bf10a57d7653b9f023324b9889ea7720df92707bbb563500'
          PYDRAFT
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
